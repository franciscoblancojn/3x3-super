<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="80" fill="#1a1a2e"/>
  <!-- Simplified 3x3 grid for maskable area -->
  <g stroke="#ad25b9" stroke-width="14" fill="none">
    <line x1="185" y1="100" x2="185" y2="412"/>
    <line x1="327" y1="100" x2="327" y2="412"/>
    <line x1="100" y1="185" x2="412" y2="185"/>
    <line x1="100" y1="327" x2="412" y2="327"/>
  </g>
  <!-- X top-left -->
  <g stroke="#0d6efd" stroke-width="16" stroke-linecap="round">
    <line x1="115" y1="115" x2="170" y2="170"/>
    <line x1="170" y1="115" x2="115" y2="170"/>
  </g>
  <!-- O center -->
  <circle cx="256" cy="256" r="45" stroke="#198754" stroke-width="16" fill="none"/>
  <!-- X bottom-right -->
  <g stroke="#ff9307" stroke-width="16" stroke-linecap="round">
    <line x1="342" y1="342" x2="397" y2="397"/>
    <line x1="397" y1="342" x2="342" y2="397"/>
  </g>
</svg>

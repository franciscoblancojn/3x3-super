<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- 3x3 grid -->
  <g stroke="#ad25b9" stroke-width="12" fill="none">
    <line x1="170" y1="90" x2="170" y2="422"/>
    <line x1="342" y1="90" x2="342" y2="422"/>
    <line x1="90" y1="170" x2="422" y2="170"/>
    <line x1="90" y1="342" x2="422" y2="342"/>
  </g>
  <!-- X in top-left -->
  <g stroke="#0d6efd" stroke-width="14" stroke-linecap="round">
    <line x1="105" y1="105" x2="155" y2="155"/>
    <line x1="155" y1="105" x2="105" y2="155"/>
  </g>
  <!-- O in center -->
  <circle cx="256" cy="256" r="40" stroke="#198754" stroke-width="14" fill="none"/>
  <!-- X in bottom-right -->
  <g stroke="#ff9307" stroke-width="14" stroke-linecap="round">
    <line x1="357" y1="357" x2="407" y2="407"/>
    <line x1="407" y1="357" x2="357" y2="407"/>
  </g>
</svg>
